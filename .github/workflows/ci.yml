name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install cargo-audit
        run: cargo install cargo-audit
        
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
        
      - name: Run cargo audit
        run: cargo audit                  # T5: known CVEs
        
      - name: Run cargo deny check
        run: cargo deny check             # T5: license + advisory policy
        
      - name: Run cargo clippy
        run: cargo clippy -- -D warnings  # T5: no allow(unused) silencing secrets
        
      - name: Run cargo test
        run: RUSTFLAGS="-D warnings" cargo test --all

  fuzz-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        
      - name: Build fuzz targets
        # Compile-only gate — full fuzzing is a separate nightly job
        run: cargo build --manifest-path src/omoide/crates/omoide-crypto/fuzz/Cargo.toml
