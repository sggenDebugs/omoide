[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"

[licenses]
unlicensed = "deny"
copyleft = "warn"
allow-osi-fsf-free = "both"
default = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "MPL-2.0",
]
# Specific crate exceptions for complex license expressions
exceptions = [
    { name = "quote", allow = ["Apache-2.0 OR MIT"] },
    { name = "syn", allow = ["Apache-2.0 OR MIT"] },
    { name = "proc-macro2", allow = ["Apache-2.0 OR MIT"] },
    { name = "unicode-ident", allow = ["MIT OR Apache-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []