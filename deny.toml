[advisories]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
skip = [
    { crate = "getrandom@0.2.17", reason = "RustCrypto ecosystem uses older getrandom, while uuid/tempfile use latest" },
    { name = "rand_core" },
    { name = "cpufeatures" }
]


[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []