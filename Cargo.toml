# Cargo.toml (workspace root)
[workspace]
resolver = "2"
members = [
    "src/omoide/crates/omoide-core", "src/omoide/crates/omoide-crypto", "src/omoide/crates/omoide-format",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
authors     = ["Inigo Gonzalez"]
license     = "MIT"
rust-version = "1.85"

# Shared dep versions — single source of truth
[workspace.dependencies]
# Crypto (T1, T2)
aes-gcm    = { version = "0.10", features = ["aes"] }
argon2     = { version = "0.5" }
hkdf       = { version = "0.12" }
sha2       = { version = "0.10" }

# Memory safety (T1)
zeroize    = { version = "1.8", features = ["derive"] }
secrecy    = { version = "0.8", features = ["serde"] }
memsec     = { version = "0.7" }

# Serialization
serde      = { version = "1", features = ["derive"] }
ciborium   = { version = "0.2" }

# Utilities
rand       = { version = "0.8" }
uuid       = { version = "1", features = ["v4", "serde"] }
thiserror  = { version = "2" }

# Platform (T1 — core dump suppression)
libc       = { version = "0.2" }

[profile.release]
strip    = "symbols"   # no symbol leakage in release binary
opt-level = 3
lto      = "thin"
