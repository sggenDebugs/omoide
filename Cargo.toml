# Cargo.toml (workspace root)
[workspace]
resolver = "2"
members = ["src/omoide/crates/omoide-cli",
    "src/omoide/crates/omoide-core", "src/omoide/crates/omoide-crypto", "src/omoide/crates/omoide-env", "src/omoide/crates/omoide-format"
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
authors     = ["Inigo Gonzalez"]
license     = "MIT"
rust-version = "1.85"

[workspace.dependencies]
aes-gcm    = { version = "0.10", features = ["aes"] }
argon2     = { version = "0.5", features = ["std"] }
hkdf       = { version = "0.12" }
sha2       = { version = "0.10" }
zeroize    = { version = "1.8", features = ["derive"] }
memsec     = { version = "0.7" }
serde      = { version = "1", features = ["derive"] }
ciborium   = { version = "0.2" }
rand       = { version = "0.10" }
uuid       = { version = "1", features = ["v4", "serde"] }
thiserror  = { version = "2" }
libc       = { version = "0.2" }
windows-sys = { version = "<=0.61", features = ["Win32_Foundation"] }

[profile.release]
strip    = "symbols"   # no symbol leakage in release binary
opt-level = 3
lto      = "thin"